name = "ashlagi_match_types"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution", "Verification"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "FormalConjecturesForMathlib"
globs = ["FormalConjecturesForMathlib.+"]

[[lean_lib]]
name = "FormalConjectures"
globs = ["FormalConjectures.+"]

[[lean_lib]]
name = "Ashlagi"
globs = ["Ashlagi.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]
[lean_lib.leanOptions]
warn.sorry = false

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_lib]]
name = "Verification"
roots = ["Verification"]

[[lean_lib]]
name = "MarketModel"
roots = ["MarketModel"]
